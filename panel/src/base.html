yapi(){
  const q = ($('#flt')?.value || '').toLowerCase();
  const cols = [
    {h:'Tablo', f:t=>`${esc(t.n)}<div class="code">${t.id}</div>`},
    {h:'Alan', n:1, f:t=>t.f}, {h:'İlişki', n:1, f:t=>t.l}, {h:'Formül', n:1, f:t=>t.fx},
    {h:'Satır', n:1, f:t=>{ const v=rowsOf(t); if(live[t.id]===undefined) return v; const d=live[t.id]-t.r; return d? `${v} <span class="${d>0?'delta-up':'delta-down'}">${d>0?'+':''}${d}</span>` : String(v); }}
  ];
  return `<input id="flt" class="filter" type="search" placeholder="Tablo ara (ad veya kimlik)" value="${esc(q)}" aria-label="Tablo ara">` +
    groups.map(g=>{
      if(YF&&!YF.includes(g.name.slice(0,2)))return '';
      const rows = g.t.filter(t=>!q || t.n.toLowerCase().includes(q) || String(t.id).includes(q));
      if(!rows.length) return '';
      return `<details open><summary>${esc(g.name)} <small>${g.t.length} tablo · ${g.f} alan · ${g.l} ilişki · ${g.fx} formül</small></summary>${table(cols, rows)}</details>`;
    }).join('');
},

/* 1) Tablo ilişki ağı */
views.ag=function(){
  const ok=i=>!ALW||ALW(i),n=TD.filter((t,i)=>ok(i)).length,cx=550,cy=450,R=300,GAP=.08;
  const order=TD.map((t,i)=>i).filter(ok).sort((a,b)=>TD[a].g-TD[b].g||a-b);
  let gaps=0;order.forEach((i,k)=>{if(k&&TD[i].g!==TD[order[k-1]].g)gaps++});
  const step=(2*Math.PI-gaps*GAP)/n;let a=-Math.PI/2;const P={};
  order.forEach((i,k)=>{if(k&&TD[i].g!==TD[order[k-1]].g)a+=GAP;P[i]=[cx+R*Math.cos(a),cy+R*Math.sin(a),a];a+=step});
  const E=[],deg=TD.map(()=>0),pairs=new Set();
  TD.forEach((t,i)=>t.o.forEach(p=>{if(p[0]!==i&&ok(i)&&ok(p[0])){E.push([i,p[0],p[1]]);deg[i]++;deg[p[0]]++;pairs.add(Math.min(i,p[0])+'_'+Math.max(i,p[0]))}}));
  const nb=new Set();if(SEL!=null){nb.add(SEL);E.forEach(e=>{if(e[0]===SEL)nb.add(e[1]);if(e[1]===SEL)nb.add(e[0])})}
  const inG=i=>FG==null||TD[i].g===FG;
  let s='',lbl='';
  E.forEach(([i,j,c])=>{
    const A=P[i],B=P[j],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,off=(i<j?1:-1)*11;
    const qx=cx+(mx-cx)*.12-dy/L*off,qy=cy+(my-cy)*.12+dx/L*off;
    const on=SEL!=null&&(i===SEL||j===SEL);
    const dim=SEL!=null?!on:(FG!=null&&!(inG(i)||inG(j)));
    const hi=SEL==null&&FG!=null&&(inG(i)||inG(j));
    const w=on?1.5+Math.min(c,6)*.5:.7+Math.min(c,8)*.28;
    s+=`<path class="ed${on||hi?' on':''}" d="M${A[0].toFixed(1)} ${A[1].toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}" style="stroke:${GC[TD[i].g]};stroke-width:${w};opacity:${dim?.05:on?.95:hi?.75:.34}"><title>${esc(lab(TD[i].n))} → ${esc(lab(TD[j].n))}: ${c} ilişki alanı</title></path>`;
    if(on){lbl+=`<text x="${(.25*A[0]+.5*qx+.25*B[0]).toFixed(1)}" y="${(.25*A[1]+.5*qy+.25*B[1]).toFixed(1)}" text-anchor="middle" class="elb">${c}</text>`}
  });
  order.forEach((i,k)=>{
    const p=P[i],t=TD[i],right=Math.cos(p[2])>=0,on=SEL!=null?nb.has(i):inG(i),r=5+Math.sqrt(deg[i])*.9;
    const lx=p[0]+(right?1:-1)*(r+8),ly=p[1]+Math.sin(p[2])*6+4;
    s+=`<g class="nd" data-s="${i}" tabindex="0" role="button" aria-label="${esc(t.n)}" style="opacity:${on?1:.25}">${i===SEL?`<circle class="pulse" cx="${p[0]}" cy="${p[1]}" r="${r+2}"/>`:''}<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===SEL?r+3:r}" style="fill:${GC[t.g]};animation-delay:${((k*.17)%3).toFixed(2)}s"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${right?'start':'end'}" style="font-size:10.5px${i===SEL?';font-weight:700':''}">${esc(lab(t.n))} (${t.r})</text></g>`;
  });
  const groups=[...new Set(TD.filter((t,i)=>ok(i)).map(t=>t.g))].sort((a,b)=>a-b);
  const lg=`<div class="chips" style="margin:10px 0 12px"><button type="button" class="chip${FG==null?' sel':''}" data-g="-1">Tümü</button>${groups.map(g=>`<button type="button" class="chip${FG===g?' sel':''}" data-g="${g}"><i style="background:${GC[g]}"></i>${esc(TD.find(t=>t.g===g).gn)}</button>`).join('')}</div>`;
  const top=[...TD.keys()].filter(ok).sort((a,b)=>deg[b]-deg[a]).slice(0,1)[0];
  return `<div class="tiles"><div class="tile"><b>${n}</b><span>tablo (düğüm)</span></div><div class="tile"><b>${pairs.size}</b><span>bağlı tablo çifti</span></div><div class="tile"><b>${totals.l}</b><span>ilişki alanı</span></div><div class="tile"><b style="font-size:17px;padding:5px 0">${esc(lab(TD[top].n))}</b><span>en çok bağı olan (${deg[top]})</span></div></div>
  <section class="panel"><h2>${NT}: hangi tablo kiminle bağlı</h2>
  <p class="note" style="margin:0">Her akan çizgi en az bir ilişki alanı demek; kalın çizgi çok alan demek. Çizginin renği çıkış tablosunun grubudur, akış yönü hedef tabloyu gösterir. Büyük nokta çok bağlantılı tablo. Parantez içindeki sayı satır sayısı. Bir tabloya tıkla: bağları vurgulanır, altında detay açılır. Gruba tıklayarak SYS veya CHAT gibi bir grubun bağlarını öne çıkar.</p>${lg}
  ${svgBox(900,s+lbl,820)}</section>${SEL!=null?tdetail(SEL):'<p class="note">Bir tabloya tıkla.</p>'}`;
};

};

  ids.forEach((k,i)=>{const n=KN[k],act=sel==null||sel===i||KE.some(r=>(r[0]===k&&ids.indexOf(r[1])===sel)||(r[1]===k&&ids.indexOf(r[0])===sel));
    s+=gnode(n[1],n[2],172,42,n[0],n[3],n[3]==='P0'?'var(--crit)':n[3]==='P1'?'var(--warn)':'var(--muted)',!act,sel===i,i)});

  return `<section class="panel"><h2>Görev bağı: hangi görev hangisine bağlı</h2><p class="note" style="margin:0 0 8px">Ok yönü: önce yapılması gereken → sonra gelen. Kesikli ok koşullu bağ. Kırmızı P0, turuncu P1, gri P2.</p>${svgBox(460,MK+s,820)}</section>${det}`;
};

function netIn(grp,title){
  ALW=i=>grp.includes(TD[i].g);NT=title;
  if(SEL!=null&&!ALW(SEL))SEL=null;if(FG!=null&&!grp.includes(FG))FG=null;
  const out=new Set();
  TD.forEach((t,i)=>t.o.forEach(p=>{if(p[0]===i)return;if(ALW(i)&&!ALW(p[0]))out.add(p[0]);if(!ALW(i)&&ALW(p[0]))out.add(i)}));
  const note=`<p class="note" style="margin-top:0">Bu bölümün dışındaki tablolarla ${out.size} bağ var${out.size?': '+[...out].map(i=>esc(lab(TD[i].n))).join(', '):''}. Hepsini birlikte görmek için <a href="#ag">Tüm ilişki ağı</a>.</p>`;
  const h=views.ag();ALW=null;NT='İlişki ağı';return note+h;
}

  <section class="panel" style="margin-bottom:14px"><h2>Bu bölüm ne işe yarıyor?</h2><p style="margin:0 0 8px">Senaryo Motoru, “ya şöyle olsaydı” hesapları içindir: finansman alternatiflerini (örneğin 12 ay ertelemeli satıcı kredisi) gerçek kayıtlara dokunmadan denemek ve karşılaştırmak için kurulmuş tablolar. Sonuç, işin finansman kararına girdi olur.</p><p class="note" style="margin:0">Şu an hepsi boş. Kayıtlarda boş olmasının nedeni açıkça yazmıyor; ilgili açık işler aşağıda (finansman modeli kararları kullanıcıdan bekleniyor).</p></section>
  <section class="panel" style="margin-bottom:14px"><h2>Okuma sırası: bir senaryo nasıl kurulur</h2>${[[23,'1. Ana kayıt','Bir senaryonun kimliği: finansman, mülkiyet, ithalat, çıkış modeli ve kur varsayımı. Diğer beş tablo bu kayda bağlanır; ayrıca Firmalar ve Projeler ile bağlıdır.'],[24,'2. Finansman dilimleri','Parayı kim, nasıl veriyor: araç, anapara, faiz, vade, erteleme, balloon ve komisyon.'],[25,'3. Ödeme planı','Dilimlerin dönem dönem geri ödeme satırları ve toplam borç servisi.'],[28,'4. Gelir gider akışı','Senaryoda toplam gelir ve gider, net nakit akışı, borç servisi ve DSCR.'],[26,'5. Varsayımlar','Hesapta kullanılan parametreler, değerleri, kaynakları ve doğrulama durumu. Hangi rakama ne kadar güvendiğini gösterir.'],[27,'6. Değerlendirme','Sonuç ölçüleri: IRR, NPV, DSCR, net kâr. Senaryoları karşılaştırmak için son durak.']].map(x=>`<div class="tcard info"><div class="th"><b>${x[1]}</b><button type="button" class="chip" data-s="${x[0]}">${esc(TD[x[0]].n)} (${TD[x[0]].r} satır)</button></div><div class="why">${x[2]}</div><div class="why"><b>Bağlandığı tablolar</b> ${TD[x[0]].o.filter(p=>p[0]!==x[0]).map(p=>esc(lab(TD[p[0]].n))).join(', ')||'—'}</div></div>`).join('')}</section>

const MSG = {
  server_not_connected:'Baserow bağlayıcısı bu hesapta bulunamadı. Claude ayarlarında Bağlayıcılar bölümünden ekle.',
  needs_reauth:'Baserow bağlantısının süresi dolmuş. Bağlayıcıyı yeniden bağla.',

  approval_required:'Baserow okuması için onay gerekiyor. Düğmeye tekrar bas.',
  blocked_by_policy:'Kuruluş politikası bu bağlayıcı çağrısını engelliyor.',
  selection_required:'Birden fazla Baserow bağlayıcın var, Claude\'un sorduğu seçimi yap.'
};
async function liveRefresh(mcp){
  const btn = $('#liveBtn'), st = $('#liveStatus');
  btn.disabled = true; let ok = 0, fail = 0, stop = null;
  const queue = [...D.tables];
  const worker = async () => {
    while (queue.length && !stop) {
      const t = queue.shift();
      try {
        const res = await mcp.callTool(SERVER, 'list_table_rows', {table_id:t.id, size:1}, {cache:false});
        let p = res.payload; if (typeof p === 'string') { try { p = JSON.parse(p); } catch(e){} }
        if (p && typeof p.count === 'number') { live[t.id] = p.count; ok++; } else fail++;
      } catch (e) {
        if (['server_not_connected','needs_reauth','not_in_manifest','approval_required','blocked_by_policy','selection_required','not_granted','capability_disabled'].includes(e.code)) stop = e;
        else fail++;
      }
      st.textContent = `Okunuyor… ${ok + fail}/${D.tables.length}`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  btn.disabled = false;
  if (stop) { st.textContent = MSG[stop.code] || `Canlı okuma yapılamadı (${stop.code}).`; }
  else { liveAt = new Date(); st.textContent = `Canlı: ${ok} tablo okundu${fail?`, ${fail} okunamadı`:''} · ${liveAt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`; }
  const changed = D.tables.filter(t=>live[t.id]!==undefined && live[t.id]!==t.r).length;
  if (!stop && changed) st.textContent += ` · ${changed} tabloda fark var (Yapı sekmesi)`;
  route();
}
(async () => {
  try {
    const mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if (!mcp) return;
    const b = $('#liveBtn'); b.hidden = false;
    b.addEventListener('click', () => liveRefresh(mcp));
  } catch (e) {}
})();
