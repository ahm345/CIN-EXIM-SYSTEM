<title>CIN EXIM Kontrol Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: üstte başlık + sekme şeridi, altında tek sütun içerik; geniş ekranda iki sütunlu bölümler.
   Dil: gümrük defteri gibi sıkı, tablo ağırlıklı; vurgu rengi tek (deniz yeşili), durum renkleri ayrı. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface2:#e9ede8; --line:#d3d9d2; --fg:#16201e; --muted:#58665f;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#d7ebe7;
  --ok:#1d7a3e; --ok-bg:#dcf0e2; --warn:#8a5a00; --warn-bg:#f8ebc8; --crit:#a3262a; --crit-bg:#f7dcdc; --info:#25598f; --info-bg:#dce9f6;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172120; --surface2:#1e2b29; --line:#2b3a37; --fg:#e4ece9; --muted:#97a8a2;
  --accent:#4fbfb2; --accent-ink:#06211e; --accent-soft:#17403b;
  --ok:#6fd08c; --ok-bg:#173a25; --warn:#e8b94f; --warn-bg:#3d3112; --crit:#f08a8d; --crit-bg:#431a1c; --info:#8dbcf0; --info-bg:#172b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172120; --surface2:#1e2b29; --line:#2b3a37; --fg:#e4ece9; --muted:#97a8a2;
  --accent:#4fbfb2; --accent-ink:#06211e; --accent-soft:#17403b;
  --ok:#6fd08c; --ok-bg:#173a25; --warn:#e8b94f; --warn-bg:#3d3112; --crit:#f08a8d; --crit-bg:#431a1c; --info:#8dbcf0; --info-bg:#172b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font:600 22px/1.2 var(--sans);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;margin-bottom:18px}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h2{font:600 15px/1.3 var(--sans);margin:0 0 10px}
h3{font:500 12px/1.3 var(--sans);margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tile b{display:block;font:500 26px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.tile.warn b{color:var(--warn)} .tile.crit b{color:var(--crit)} .tile.ok b{color:var(--ok)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 11.5px/1.3 var(--sans);text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--surface2);color:var(--muted)}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(110px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px;min-width:2px}
.bar .tr{background:var(--surface2);border-radius:2px}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.attn li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
summary{cursor:pointer;padding:10px 16px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
summary small{font-weight:400;color:var(--muted);font-family:var(--mono)}
details>.tablewrap{padding:0 8px 8px}
.filter{width:100%;max-width:360px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:14px}
.status{font-size:12.5px;color:var(--muted);min-height:1.4em}
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.chk.done span{color:var(--muted);text-decoration:line-through}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface2)}
.menu b{font-family:var(--mono);color:var(--accent);margin-right:6px}
.note{color:var(--muted);font-size:12.5px}
.delta-up{color:var(--ok)} .delta-down{color:var(--crit)}
@media (max-width:560px){h1{font-size:19px} .bar{grid-template-columns:100px 1fr 40px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- ilişki haritaları ---- */
.sc{overflow-x:auto}
svg text{fill:var(--fg);font:12px var(--sans)} svg .mu{fill:var(--muted);font-size:11px} svg .elb{font:600 11px var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip:hover{border-color:var(--accent)} .chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fx{margin:6px 0;font-size:12.5px} .fx code{display:block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;margin-top:3px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font:12px var(--mono)}
.nd,.nd2{cursor:pointer;outline:none;transition:opacity .25s} .nd:focus-visible circle.dot,.nd2:focus-visible rect{stroke:var(--accent);stroke-width:3}
.nd:hover circle.dot{stroke:var(--fg);stroke-width:2} .nd2:hover rect{stroke:var(--accent)!important}
.ed{fill:none;stroke-dasharray:2 8;transition:opacity .25s} .ed.on{stroke-dasharray:7 5}
.pulse{fill:none;stroke:var(--accent);stroke-width:2}
@media (prefers-reduced-motion:no-preference){
  .ed{animation:flow 2.6s linear infinite} .ed.on{animation-duration:.9s}
  @keyframes flow{to{stroke-dashoffset:-30}}
  .nd circle.dot{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.22)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
  .stp rect{animation:glow 12.6s linear infinite;animation-delay:var(--d)}
  @keyframes glow{0%,7%{stroke:var(--accent);stroke-width:3.6}10%,100%{stroke-width:1.6}}
}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:11px 14px;margin-bottom:10px}
.tcard.crit{border-left-color:var(--crit)}.tcard.warn{border-left-color:var(--warn)}.tcard.info{border-left-color:var(--info)}.tcard.ok{border-left-color:var(--ok)}
.tcard .th{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}.why{font-size:13px;margin:3px 0}.why b{color:var(--muted);font-weight:500;margin-right:4px}
.chk2{border-bottom:1px solid var(--line);padding:2px 0}.chk2:last-child{border-bottom:0}.chk2 details{border:0;margin:0 0 6px 26px;background:none}.chk2 summary{padding:2px 0;font-weight:400;color:var(--accent);font-size:12.5px}
#nav2{display:flex;gap:2px;overflow-x:auto;margin:-8px 0 16px;border-bottom:1px solid var(--line)}
#nav2 a{padding:6px 12px;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;border-radius:6px 6px 0 0}
#nav2 a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.rq{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.rqc{display:flex;gap:6px;flex-wrap:wrap}
.rqb{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.rqb.on{color:#fff;border-color:transparent}.rqb.on[data-o=yap]{background:var(--ok)}.rqb.on[data-o=yapma]{background:var(--crit)}.rqb.on[data-o=sonra]{background:var(--warn)}.rqb.on[data-o=soru]{background:var(--info)}.rqb.on[data-o=guncelle]{background:var(--accent)}
.rqn{width:100%;margin-top:6px;min-height:34px;resize:vertical;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
#rqout{width:100%;min-height:240px;font:12px ui-monospace,Menlo,monospace;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px}
.rqf{display:grid;gap:6px}.rqf input,.rqf select{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}.tablewrap .rq{min-width:190px;margin:0;padding:0;border:0}
.rcards{display:grid;gap:10px}.rel{display:flex;gap:10px;align-items:center;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}.rel svg{flex:none}.rl{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.accs{display:block}.acc{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 10px}
.acch{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;font:600 15px/1.3 inherit;color:var(--fg);background:none;border:0;cursor:pointer}
.acch::after{content:"▸";color:var(--muted);transition:transform .2s}.acc.open .acch::after{transform:rotate(90deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.acc.open .accb{grid-template-rows:1fr}
.accb>div{overflow:hidden;padding:0 14px;visibility:hidden}.acc.open .accb>div{padding:0 14px 14px;visibility:visible}
@media (prefers-reduced-motion:reduce){.accb,.acch::after{transition:none}}

/* ---- v3: iş bölümü, senaryo, ekonomik menü ---- */
nav a{padding:7px 14px}
#nav2 a{padding:5px 11px;font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg a{padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font-size:12.5px;background:var(--surface)}
.seg a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:7px 12px;font-size:12.5px;margin:0 0 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.kv b{display:block;font:500 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}.kv span{color:var(--muted);font-size:12px}
.kv .crit b{color:var(--crit)}.kv .warn b{color:var(--warn)}.kv .ok b{color:var(--ok)}
.sct{overflow-x:auto}
.sct table td,.sct table th{white-space:nowrap}
.sct td.lbl{white-space:normal;min-width:150px;color:var(--muted)}
.sct td.bad{color:var(--crit);font-weight:500}.sct td.good{color:var(--ok);font-weight:500}
.sf{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 0 10px}
.sf label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.sf input,.sf select{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px var(--mono);min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0 0}
.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.hbar .tr{background:var(--surface2);border-radius:2px;height:10px}.hbar i{display:block;height:10px;border-radius:2px;background:var(--accent)}
.hbar.crit i{background:var(--crit)}.hbar.warn i{background:var(--warn)}.hbar.ok i{background:var(--ok)}.hbar.info i{background:var(--info)}
.todo{margin:0;padding-left:20px;line-height:1.7}
.tcard details{border:0;background:none;margin:4px 0 0}.tcard details summary{padding:2px 0;color:var(--accent);font-weight:500;font-size:12.5px}
.tcard ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
/* ---- v4: wiki, formlar, harita ---- */
details.wk{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 8px;min-width:0}
details.wk>summary{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none;font-weight:500}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary::before{content:'▸';color:var(--muted);transition:transform .15s}
details.wk[open]>summary::before{transform:rotate(90deg)}
details.wk>summary small{color:var(--muted);font-weight:400;font-size:12px}
details.wk>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wkb{padding:2px 14px 12px;min-width:0}
details.wk[open]>.wkb{animation:wkdn .18s ease}
@keyframes wkdn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
details.wk details.wk{border:0;border-top:1px dashed var(--line);border-radius:0;background:none;margin:0}
@media (prefers-reduced-motion:reduce){details.wk[open]>.wkb{animation:none}}
.tgb{font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer}
.tgb:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ffm{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.fg{display:grid;gap:3px;min-width:0;align-content:start}.fg label{font-size:12px;color:var(--muted)}
.fg input,.fg select,.fg textarea{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px var(--sans);min-width:0;width:100%;box-sizing:border-box}
.fgb{display:flex;align-items:center;gap:8px}.fgb input{width:auto}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.sct td.cl{white-space:normal;max-width:46ch}
svg .mu{fill:var(--muted);font-size:10.5px;letter-spacing:.04em}
svg g[tabindex]:focus-visible{outline:2px solid var(--accent)}

.gr{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr auto;gap:8px;align-items:center;font-size:12px;padding:2px 0;min-width:0}
.gr>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb{display:block;background:var(--surface2);border-radius:4px;height:12px;overflow:hidden}
.gb i{display:block;height:100%;border-radius:4px;background:var(--info)}
.gb i.ok{background:var(--ok)}.gb i.lk{background:var(--muted);opacity:.5}
.pli,.sf2 input,.sf2 select,td input,td select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px}
.sf2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0}
.sf2 label{display:flex;flex-direction:column;gap:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media(max-width:640px){.gr{grid-template-columns:1fr;gap:2px}}

.rel{margin:10px 0 4px;border-top:1px dashed var(--line);padding-top:8px}
.rlh{font-size:12px;margin-bottom:6px}.rlg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.rlt{font:11px var(--mono);color:var(--muted);min-width:46px;text-transform:uppercase}
.rc{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc small{color:var(--muted)}
.rc.t-f{border-color:var(--accent)}.rc.t-t{border-color:var(--info)}.rc.t-a{border-color:var(--warn)}.rc.t-s{border-color:var(--muted)}
.rc.on{background:var(--accent-soft)}
.rc[data-gt]:not(.on){opacity:.45;text-decoration:line-through}
.relx{display:block}
.relo{margin:8px 0 4px 10px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px;background:var(--surface2)}
.relo.t-f{border-left-color:var(--accent)}.relo.t-t{border-left-color:var(--info)}.relo.t-a{border-left-color:var(--warn)}
.rloh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.gtools input,.gtools select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px}
.gsvg{width:100%;height:auto;aspect-ratio:3/2;max-height:62vh;background:var(--surface2);border:1px solid var(--line);border-radius:10px;touch-action:pan-y;cursor:grab;display:block}
.gsvg .ln{stroke:var(--lc,var(--muted));stroke-opacity:.45;stroke-width:1}
.gsvg .gn{cursor:pointer}.gsvg .gn circle{stroke:var(--surface);stroke-width:1.5}
.gsvg .t-f circle{fill:var(--accent)}.gsvg .t-t circle{fill:var(--info)}.gsvg .t-a circle{fill:var(--warn)}.gsvg .t-s circle{fill:var(--muted)}
.gsvg text{font:10px var(--sans);fill:var(--fg);text-anchor:middle;opacity:0;pointer-events:none;paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.gsvg text.big,.gsvg .gn.sel text,.gsvg .gn.hl text,.gsvg .gn.mt text{opacity:1}
.gsvg .gn.sel circle{stroke:var(--fg);stroke-width:2.5}
.gsvg .gn.mt circle{stroke:var(--crit);stroke-width:3}
.gsvg.dim .gn:not(.hl){opacity:.18}.gsvg.dim .ln{stroke-opacity:.08}.gsvg.dim .ln.hl{stroke-opacity:.9;stroke-width:1.6}
.gsvg .hid{display:none}
.gsvg .gn{touch-action:none}
.pnpick #view,.pnpick #view *,.pnpick #nav a,.pnpick #nav2 a{cursor:crosshair!important}

yapi(){
  const q = ($('#flt')?.value || '').toLowerCase();
  const cols = [
    {h:'Tablo', f:t=>`${esc(t.n)}<div class="code">${t.id}</div>`},
    {h:'Alan', n:1, f:t=>t.f}, {h:'İlişki', n:1, f:t=>t.l}, {h:'Formül', n:1, f:t=>t.fx},
    {h:'Satır', n:1, f:t=>{ const v=rowsOf(t); if(live[t.id]===undefined) return v; const d=live[t.id]-t.r; return d? `${v} <span class="${d>0?'delta-up':'delta-down'}">${d>0?'+':''}${d}</span>` : String(v); }}
  ];
  return `<input id="flt" class="filter" type="search" placeholder="Tablo ara (ad veya kimlik)" value="${esc(q)}" aria-label="Tablo ara">` +
    groups.map(g=>{
      if(YF&&!YF.includes(g.name.slice(0,2)))return '';
      const rows = g.t.filter(t=>!q || t.n.toLowerCase().includes(q) || String(t.id).includes(q));
      if(!rows.length) return '';
      return `<details open><summary>${esc(g.name)} <small>${g.t.length} tablo · ${g.f} alan · ${g.l} ilişki · ${g.fx} formül</small></summary>${table(cols, rows)}</details>`;
    }).join('');
},

/* 1) Tablo ilişki ağı */
views.ag=function(){
  const ok=i=>!ALW||ALW(i),n=TD.filter((t,i)=>ok(i)).length,cx=550,cy=450,R=300,GAP=.08;
  const order=TD.map((t,i)=>i).filter(ok).sort((a,b)=>TD[a].g-TD[b].g||a-b);
  let gaps=0;order.forEach((i,k)=>{if(k&&TD[i].g!==TD[order[k-1]].g)gaps++});
  const step=(2*Math.PI-gaps*GAP)/n;let a=-Math.PI/2;const P={};
  order.forEach((i,k)=>{if(k&&TD[i].g!==TD[order[k-1]].g)a+=GAP;P[i]=[cx+R*Math.cos(a),cy+R*Math.sin(a),a];a+=step});
  const E=[],deg=TD.map(()=>0),pairs=new Set();
  TD.forEach((t,i)=>t.o.forEach(p=>{if(p[0]!==i&&ok(i)&&ok(p[0])){E.push([i,p[0],p[1]]);deg[i]++;deg[p[0]]++;pairs.add(Math.min(i,p[0])+'_'+Math.max(i,p[0]))}}));
  const nb=new Set();if(SEL!=null){nb.add(SEL);E.forEach(e=>{if(e[0]===SEL)nb.add(e[1]);if(e[1]===SEL)nb.add(e[0])})}
  const inG=i=>FG==null||TD[i].g===FG;
  let s='',lbl='';
  E.forEach(([i,j,c])=>{
    const A=P[i],B=P[j],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,off=(i<j?1:-1)*11;
    const qx=cx+(mx-cx)*.12-dy/L*off,qy=cy+(my-cy)*.12+dx/L*off;
    const on=SEL!=null&&(i===SEL||j===SEL);
    const dim=SEL!=null?!on:(FG!=null&&!(inG(i)||inG(j)));
    const hi=SEL==null&&FG!=null&&(inG(i)||inG(j));
    const w=on?1.5+Math.min(c,6)*.5:.7+Math.min(c,8)*.28;
    s+=`<path class="ed${on||hi?' on':''}" d="M${A[0].toFixed(1)} ${A[1].toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}" style="stroke:${GC[TD[i].g]};stroke-width:${w};opacity:${dim?.05:on?.95:hi?.75:.34}"><title>${esc(lab(TD[i].n))} → ${esc(lab(TD[j].n))}: ${c} ilişki alanı</title></path>`;
    if(on){lbl+=`<text x="${(.25*A[0]+.5*qx+.25*B[0]).toFixed(1)}" y="${(.25*A[1]+.5*qy+.25*B[1]).toFixed(1)}" text-anchor="middle" class="elb">${c}</text>`}
  });
  order.forEach((i,k)=>{
    const p=P[i],t=TD[i],right=Math.cos(p[2])>=0,on=SEL!=null?nb.has(i):inG(i),r=5+Math.sqrt(deg[i])*.9;
    const lx=p[0]+(right?1:-1)*(r+8),ly=p[1]+Math.sin(p[2])*6+4;
    s+=`<g class="nd" data-s="${i}" tabindex="0" role="button" aria-label="${esc(t.n)}" style="opacity:${on?1:.25}">${i===SEL?`<circle class="pulse" cx="${p[0]}" cy="${p[1]}" r="${r+2}"/>`:''}<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===SEL?r+3:r}" style="fill:${GC[t.g]};animation-delay:${((k*.17)%3).toFixed(2)}s"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${right?'start':'end'}" style="font-size:10.5px${i===SEL?';font-weight:700':''}">${esc(lab(t.n))} (${t.r})</text></g>`;
  });
  const groups=[...new Set(TD.filter((t,i)=>ok(i)).map(t=>t.g))].sort((a,b)=>a-b);
  const lg=`<div class="chips" style="margin:10px 0 12px"><button type="button" class="chip${FG==null?' sel':''}" data-g="-1">Tümü</button>${groups.map(g=>`<button type="button" class="chip${FG===g?' sel':''}" data-g="${g}"><i style="background:${GC[g]}"></i>${esc(TD.find(t=>t.g===g).gn)}</button>`).join('')}</div>`;
  const top=[...TD.keys()].filter(ok).sort((a,b)=>deg[b]-deg[a]).slice(0,1)[0];
  return `<div class="tiles"><div class="tile"><b>${n}</b><span>tablo (düğüm)</span></div><div class="tile"><b>${pairs.size}</b><span>bağlı tablo çifti</span></div><div class="tile"><b>${totals.l}</b><span>ilişki alanı</span></div><div class="tile"><b style="font-size:17px;padding:5px 0">${esc(lab(TD[top].n))}</b><span>en çok bağı olan (${deg[top]})</span></div></div>
  <section class="panel"><h2>${NT}: hangi tablo kiminle bağlı</h2>
  <p class="note" style="margin:0">Her akan çizgi en az bir ilişki alanı demek; kalın çizgi çok alan demek. Çizginin renği çıkış tablosunun grubudur, akış yönü hedef tabloyu gösterir. Büyük nokta çok bağlantılı tablo. Parantez içindeki sayı satır sayısı. Bir tabloya tıkla: bağları vurgulanır, altında detay açılır. Gruba tıklayarak SYS veya CHAT gibi bir grubun bağlarını öne çıkar.</p>${lg}
  ${svgBox(900,s+lbl,820)}</section>${SEL!=null?tdetail(SEL):'<p class="note">Bir tabloya tıkla.</p>'}`;
};

  ids.forEach((k,i)=>{const n=KN[k],act=sel==null||sel===i||KE.some(r=>(r[0]===k&&ids.indexOf(r[1])===sel)||(r[1]===k&&ids.indexOf(r[0])===sel));
    s+=gnode(n[1],n[2],172,42,n[0],n[3],n[3]==='P0'?'var(--crit)':n[3]==='P1'?'var(--warn)':'var(--muted)',!act,sel===i,i)});

  return `<section class="panel"><h2>Görev bağı: hangi görev hangisine bağlı</h2><p class="note" style="margin:0 0 8px">Ok yönü: önce yapılması gereken → sonra gelen. Kesikli ok koşullu bağ. Kırmızı P0, turuncu P1, gri P2.</p>${svgBox(460,MK+s,820)}</section>${det}`;
};

const SBASE = {V:3990000, dp:15, bOwn:0, bR:6.5, bM:6, lR:4.5, T:60, G:0, inc:1, rent:63240, RM:60, w:15, opex:0, resid:0, inc0:95000};
function sim(p){
  p = Object.assign({}, SBASE, p);
  const bridge = p.bOwn ? 0 : p.V*p.dp/100, loan = p.V*(1-p.dp/100);
  const N = p.inc ? Math.max(p.T-p.G,1) : p.T, LM = p.G+N;
  const H = Math.max(p.RM, LM, bridge>0?p.bM:0);
  let bal = loan, sDS=0, sCF=0, sInt=0, minAll=null, minEx=null, below=0, peakEx=0;
  const m = [];
  for(let k=1;k<=H;k++){
    let li=0, lp=0;
    if(k<=LM){ li = bal*p.lR/1200; lp = k>p.G ? loan/N : 0; bal -= lp; }
    let bi=0, bp=0;
    if(bridge>0 && k<=p.bM){ bi = bridge*p.bR/1200; bp = (k===p.bM) ? bridge : 0; }
    const ds = li+lp+bi+bp, dsEx = ds-bp;
    const cf = k<=p.RM ? p.rent*(1-p.w/100)-p.opex : 0;
    sDS+=ds; sCF+=cf; sInt+=li+bi;
    const d = ds>0 ? cf/ds : null;
    if(d!==null){ if(minAll===null||d<minAll) minAll=d; if(d<1) below++; }
    const dx = dsEx>0 ? cf/dsEx : null;
    if(dx!==null && (minEx===null||dx<minEx)) minEx=dx;
    if(dsEx>peakEx) peakEx=dsEx;
    m.push({k, li, lp, bi, bp, ds, cf, d});
  }
  const k0 = p.RM*(1-p.w/100);
  return {p, m, H, bridge, loan, sDS, sCF, sInt,
    net: sCF - sDS + p.resid,
    avg: sDS>0 ? (sCF+p.resid)/sDS : 0,
    minAll, minEx, below,
    beTotal: k0>0 ? (sDS - p.resid + p.opex*p.RM)/k0 : 0,
    bePeak: (peakEx + p.opex)/(1-p.w/100),
    too: p.inc0 - p.rent};
}

function dscrChart(list){
  const W=760,Hh=250,L=40,R=10,T=10,B=28, ymax=2;
  const Hn = Math.max(...list.map(s=>s.H),12);
  const x = k => L+(k-1)/(Hn-1)*(W-L-R), y = v => T+(1-Math.min(Math.max(v,0),ymax)/ymax)*(Hh-T-B);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;min-width:560px;display:block" role="img" aria-label="Aylık DSCR">`;
  [0,0.5,1,1.5,2].forEach(v=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:${v===1?1.6:.7};${v===1?'stroke-dasharray:5 4;stroke:var(--crit)':''}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="mu">${String(v).replace('.',',')}</text>`; });
  for(let k=1;k<=Hn;k+=(Hn>40?6:3)||1){ s+=`<text x="${x(k)}" y="${Hh-10}" text-anchor="middle" class="mu">${k}</text>`; }
  s+=`<text x="${W-R}" y="${y(1)-5}" text-anchor="end" style="fill:var(--crit);font-size:11px">DSCR = 1</text>`;
  list.forEach((r,i)=>{
    const pts = r.m.filter(a=>a.d!==null).map(a=>`${x(a.k).toFixed(1)},${y(a.d).toFixed(1)}`).join(' ');
    s+=`<polyline points="${pts}" fill="none" style="stroke:${SCOL[i%SCOL.length]};stroke-width:${i===list.length-1?2.6:1.7}"/>`;
  });
  return s+'</svg>';
}

function barsDS(b){
  const W=760,Hh=230,L=46,R=10,T=14,B=26,ymax=100000, n=b.m.length, bw=(W-L-R)/n;
  const y=v=>T+(1-Math.min(v,ymax)/ymax)*(Hh-T-B);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;min-width:560px;display:block" role="img" aria-label="Aylık borç servisi ve CFADS">`;
  [0,25000,50000,75000,100000].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:.7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="mu">${v/1000}k</text>`});
  b.m.forEach(a=>{
    const x=L+(a.k-1)*bw+1, w=Math.max(bw-2,2), ip=a.li+a.bi, pr=a.lp+a.bp;
    const hp=Math.min(pr,ymax), hi=Math.min(ip,Math.max(ymax-hp,0));
    s+=`<rect x="${x.toFixed(1)}" y="${y(hp)}" width="${w.toFixed(1)}" height="${(y(0)-y(hp)).toFixed(1)}" style="fill:var(--accent)"><title>Ay ${a.k}: anapara ${fm(pr)}</title></rect>`;
    if(hi>0) s+=`<rect x="${x.toFixed(1)}" y="${y(hp+hi)}" width="${w.toFixed(1)}" height="${(y(hp)-y(hp+hi)).toFixed(1)}" style="fill:var(--warn)"><title>Ay ${a.k}: faiz ${fm(ip)}</title></rect>`;
    if(a.ds>ymax) s+=`<text x="${(x+w/2).toFixed(1)}" y="${T-2}" text-anchor="middle" style="fill:var(--crit);font-size:11px;font-weight:600">${a.k}. ay: ${fm(a.ds)}</text>`;
  });
  const cf=b.m[0].cf; s+=`<line x1="${L}" x2="${W-R}" y1="${y(cf)}" y2="${y(cf)}" style="stroke:var(--ok);stroke-width:2.2;stroke-dasharray:6 4"/><text x="${W-R}" y="${y(cf)-5}" text-anchor="end" style="fill:var(--ok);font-size:11px">CFADS ${fm(cf)}</text>`;
  for(let k=1;k<=n;k+=6) s+=`<text x="${L+(k-1)*bw+bw/2}" y="${Hh-8}" text-anchor="middle" class="mu">${k}</text>`;
  return s+'</svg>';
}

    g.valid = v.length; g.done = v.filter(s => s.d === 'Tamam').length; g.run = v.filter(s => s.d === 'Devam Ediyor').length; g.off = g.steps.length - v.length;

function stageSvg(ST) {

const tkMet = s => TK.metric === 'avg' ? s.avg : (s.minEx === null ? 99 : s.minEx);
function solveMax(key, lo, hi, base) {
  const f = v => tkMet(sim(Object.assign({}, base, { [key]: v })));
  if (f(lo) < TK.target) return null;
  if (f(hi) >= TK.target) return { v: hi, cap: true };
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (f(m) >= TK.target) lo = m; else hi = m; }
  return { v: lo };
}
function solveMin(key, lo, hi, base) {
  const f = v => tkMet(sim(Object.assign({}, base, { [key]: v })));
  if (f(hi) < TK.target) return null;
  if (f(lo) >= TK.target) return { v: lo };
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (f(m) >= TK.target) hi = m; else lo = m; }
  return { v: hi };
}
function tkCalc() {
  const base = Object.assign({}, TK), rentMax = TK.inc0 * (1 - TK.margin / 100), u = Math.max(TK.units, 1);
  const col = rent => {
    const b = Object.assign({}, base, { rent });
    const V = solveMax('V', Math.max(TK.V * 0.02, 1000), TK.V * 4, b);
    const R = solveMax('lR', 0, 40, b);
    const O = solveMax('opex', 0, Math.max(rent * (1 - TK.w / 100), 1), b);
    const cur = sim(b);
    return { rent, V, R, O, cur, too: TK.inc0 - rent };
  };
  const minRent = solveMin('rent', 0, TK.inc0 * 3, base);
  return { a: col(TK.rent), b: col(rentMax), rentMax, minRent, u };
}
function tkResult() {

    ['… otobüs başına', k => cell(k.O, v => fu(v / u))],

  else verdict = `<div class="demo" style="background:var(--crit-bg);color:var(--crit)">Kira penceresi kapalı: hedef DSCR için en az ${fu(c.minRent.v)}/ay gerekiyor, ama ÖMG gelirinden %${TK.margin} TOO marjı düşünce tavan ${fu(c.rentMax)}/ay. Fiyat, faiz veya vade düşmeli; ya da hedef gevşemeli. Sağ sütundaki sınırlar tavan kirada çıkan en yüksek değerlerdir.</div>`;
  const sens = [0.7, 0.8, 0.9, 1, 1.1].map(m => {
    const a = tkMet(sim(Object.assign({}, TK, { V: TK.V * m }))), b = tkMet(sim(Object.assign({}, TK, { V: TK.V * m, rent: c.rentMax })));
    return `<tr><td class="lbl">${pc(m * 100)} · ${fu(TK.V * m)}</td><td class="n ${a >= TK.target ? 'good' : 'bad'}">${f2(a)}</td><td class="n ${b >= TK.target ? 'good' : 'bad'}">${f2(b)}</td></tr>`;

  <tr><td class="lbl">Hedef DSCR için en düşük kira (kırılma)</td><td class="n" colspan="2">${c.minRent ? fu(c.minRent.v) + ' / ay' : 'ulaşılamaz'}</td></tr></tbody></table></div>

  const vTar = (b, S) => { const o = []; [['lot', 'Tedarikçi', 'Tedarikçi'], ['sevk', 'Taşıyıcı', 'Taşıyıcı'], ['kredi', 'Kreditör', 'Banka / kreditör'], ['kredi', 'Borçlu', 'Borçlu']].forEach(a => S[a[0]].forEach(r => V(r, a[1]).split(', ').filter(Boolean).forEach(f => { if (!o.some(x => x[0] === f && x[1] === a[2])) o.push([f, a[2]]); }))); return tb(['Firma', 'Rol'], o.map(x => [E(x[0]), E(x[1])])) + '<p class="note">Roller bağlı kayıtlardan çıkarıldı. Projeye göre rol tablosu (TASK-MULTI-002) henüz yok.</p>'; };

  const vKon = (b, S) => { const o = []; [['sevk', 'Sevkiyat'], ['kredi', 'Kredi']].forEach(a => S[a[0]].forEach(x => Object.keys(x).forEach(f => { if (/Kontrol|Mutabakat/.test(f) && typeof x[f] === 'string' && x[f]) o.push([a[1], E(V(x, 'Sevkiyat No') || V(x, 'Kredi Adı')), pl(x[f].slice(0, 90))]); }))); return tb(['Tablo', 'Kayıt', 'Sonuç'], o); };
  const vRap = (b, S) => '<button type="button" class="btn" onclick="window.print()">Yazdır / PDF</button>' + vOz(b, S) + vFin(b, S) + vBel(b, S);

const MSG = {
  server_not_connected:'Baserow bağlayıcısı bu hesapta bulunamadı. Claude ayarlarında Bağlayıcılar bölümünden ekle.',
  needs_reauth:'Baserow bağlantısının süresi dolmuş. Bağlayıcıyı yeniden bağla.',
  not_in_manifest:'Bu sayfa için Baserow izni verilmedi. Düğmeye tekrar basıp izin ver.',

  selection_required:'Birden fazla Baserow bağlayıcın var, Claude\'un sorduğu seçimi yap.'
};
async function liveRefresh(mcp){
  const btn = $('#liveBtn'), st = $('#liveStatus');
  btn.disabled = true; let ok = 0, fail = 0, stop = null;
  const queue = [...D.tables];
  const worker = async () => {
    while (queue.length && !stop) {
      const t = queue.shift();
      try {
        const res = await mcp.callTool(SERVER, 'list_table_rows', {table_id:t.id, size:1}, {cache:false});
        let p = res.payload; if (typeof p === 'string') { try { p = JSON.parse(p); } catch(e){} }
        if (p && typeof p.count === 'number') { live[t.id] = p.count; ok++; } else fail++;
      } catch (e) {
        if (['server_not_connected','needs_reauth','not_in_manifest','approval_required','blocked_by_policy','selection_required','not_granted','capability_disabled'].includes(e.code)) stop = e;
        else fail++;
      }
      st.textContent = `Okunuyor… ${ok + fail}/${D.tables.length}`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  btn.disabled = false;
  if (stop) { st.textContent = MSG[stop.code] || `Canlı okuma yapılamadı (${stop.code}).`; }
  else { liveAt = new Date(); st.textContent = `Canlı: ${ok} tablo okundu${fail?`, ${fail} okunamadı`:''} · ${liveAt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`; }
  const changed = D.tables.filter(t=>live[t.id]!==undefined && live[t.id]!==t.r).length;
  if (!stop && changed) st.textContent += ` · ${changed} tabloda fark var (Yapı sekmesi)`;
  route();
}
(async () => {
  try {
    const mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null;
    if (!mcp) return;
    const b = $('#liveBtn'); b.hidden = false;
    b.addEventListener('click', () => liveRefresh(mcp));
  } catch (e) {}
})();
